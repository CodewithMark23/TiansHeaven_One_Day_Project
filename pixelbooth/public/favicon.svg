<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff8fab;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c9b1ff;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Camera body -->
  <rect x="10" y="30" width="80" height="52" rx="12" fill="url(#grad)" />
  <!-- Viewfinder -->
  <rect x="18" y="20" width="22" height="12" rx="4" fill="url(#grad)" />
  <!-- Lens outer -->
  <circle cx="50" cy="56" r="20" fill="white" opacity="0.3" />
  <circle cx="50" cy="56" r="15" fill="white" opacity="0.4" />
  <!-- Lens inner -->
  <circle cx="50" cy="56" r="9" fill="white" opacity="0.6" />
  <!-- Shutter button -->
  <circle cx="78" cy="38" r="5" fill="white" opacity="0.5" />
  <!-- Flash -->
  <text x="50" y="62" text-anchor="middle" font-size="12" fill="white" font-family="Arial">📸</text>
</svg>